<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>New password · PageSync</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2f5d50">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-wrap">
    <form class="login-card" id="form" novalidate>
      <div class="brand"><img src="icons/icon.svg" width="32" height="32" alt=""> PageSync</div>
      <h2 style="margin:0;font-size:18px">Choose a new password</h2>
      <p id="intro">Checking your reset link…</p>
      <input class="field" type="password" id="password" placeholder="New password (8+ characters)" autocomplete="new-password" disabled>
      <input class="field" type="password" id="password2" placeholder="Repeat new password" autocomplete="new-password" disabled>
      <div class="error-text" id="error" role="alert"></div>
      <button class="btn primary" type="submit" id="submit" disabled>Save password</button>
      <a class="link-btn" href="login.html">Back to sign in</a>
    </form>
  </main>
  <script type="module">
    import { onPasswordRecovery, getSession, updatePassword } from './js/backend.js';
    const $ = (id) => document.getElementById(id);
    let ready = false;
    const enable = () => {
      if (ready) return;
      ready = true;
      $('intro').textContent = 'Enter a new password for your account.';
      for (const id of ['password', 'password2', 'submit']) $(id).disabled = false;
      $('password').focus();
    };
    onPasswordRecovery(enable);
    const { session } = await getSession();
    if (session) enable();
    setTimeout(() => {
      if (!ready) $('intro').textContent = 'This reset link is invalid or has expired. Go back and tap "Forgot password?" again.';
    }, 6000);

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      const pw = $('password').value;
      if (pw.length < 8) return ($('error').textContent = 'Use at least 8 characters.');
      if (pw !== $('password2').value) return ($('error').textContent = "The two passwords don't match.");
      $('submit').disabled = true;
      try {
        await updatePassword(pw);
        $('intro').textContent = 'Password changed! Taking you to your library…';
        setTimeout(() => location.replace('index.html'), 1200);
      } catch (err) {
        $('error').textContent = err.message;
        $('submit').disabled = false;
      }
    });
  </script>
</body>
</html>
